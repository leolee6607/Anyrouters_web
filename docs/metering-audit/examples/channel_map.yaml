# 渠道归属映射（由运营方维护并提供）
# account_label 用脱敏标签（account_a/account_b），不使用姓名或邮箱。
channels:
  - channel_id: 7
    channel_name: azure-a
    account_label: account_a
    azure_resource: rg-example/res-a
    deployment: gpt-5.6-dep
  - channel_id: 8
    channel_name: azure-b
    account_label: account_b
    azure_resource: rg-example/res-b
    deployment: gpt-5.6-dep-b
