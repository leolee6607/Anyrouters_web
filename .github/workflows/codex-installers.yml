name: Codex Installers

on:
  pull_request:
    paths:
      - 'router/install_scripts/codex*.ps1'
      - 'router/install_scripts/codex*.sh'
      - 'router/install_scripts/claude.ps1'
      - 'web/default/src/features/docs/index.tsx'
      - 'web/default/tests/codex-gpt56-catalog-compat.test.ts'
      - 'web/default/tests/codex-ci-coverage.test.ts'
      - 'web/default/tests/docs-codex-install-guidance.test.ts'
      - 'web/default/tests/install-script-conflict-cleanup.test.ts'
      - '.github/workflows/codex-installers.yml'

permissions:
  contents: read

jobs:
  windows-powershell:
    name: Codex installers (${{ matrix.powershell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        powershell: [powershell.exe, pwsh.exe]
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.14'

      - name: Require the selected PowerShell runtime
        shell: cmd
        run: where ${{ matrix.powershell }}

      - name: Verify Windows coverage and documentation regressions
        working-directory: web/default
        shell: cmd
        run: bun test tests/codex-ci-coverage.test.ts tests/docs-codex-install-guidance.test.ts

      - name: Execute Codex PowerShell installers in an isolated home
        working-directory: web/default
        shell: cmd
        env:
          PWSH_BIN: ${{ matrix.powershell }}
          REQUIRE_POWERSHELL_TESTS: '1'
          ANYROUTERS_DISPOSABLE_WINDOWS_TEST_HOST: '1'
        run: >-
          bun test tests/codex-gpt56-catalog-compat.test.ts
          --test-name-pattern "^PowerShell"

      - name: Parse Claude PowerShell installer and verify proxy safety checks
        working-directory: web/default
        shell: powershell
        run: |
          [ScriptBlock]::Create(
            (Get-Content -Raw ../../router/install_scripts/claude.ps1)
          ) | Out-Null
          bun test tests/install-script-conflict-cleanup.test.ts `
            --test-name-pattern "Windows Claude installer"
